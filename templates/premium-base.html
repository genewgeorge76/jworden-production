<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ENTITY_NAME}} | {{H1}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}">
    <link rel="canonical" href="https://{{ENTITY_DOMAIN}}/">
    <link rel="stylesheet" href="/assets/premium.css">
    <style>
        :root {
            --brand-primary: {{BRAND_PRIMARY}};
            --brand-accent: {{BRAND_ACCENT}};
            --font-stack: {{FONT_STACK}};
        }
    </style>
    <script type="application/ld+json">{{SCHEMA_JSON_LD}}</script>
</head>
<body>
    <header>
        <h1>{{ENTITY_NAME}}</h1>
        <p>{{PHONE_DISPLAY}}</p>
        <p>{{ADDRESS_SINGLE_LINE}}</p>
    </header>

    <main>
        <h2>{{H1}}</h2>
        <section id="portfolio">
            {{PORTFOLIO_SECTIONS}}
        </section>

        <section id="service-areas">
            <h3>Service Areas</h3>
            <ul>{{SERVICE_AREA_LIST}}</ul>
        </section>

        <a href="{{PRIMARY_CTA_HREF}}" class="cta-button">{{PRIMARY_CTA_TEXT}}</a>
    </main>

    <footer>
        <p>© 2026 {{ENTITY_NAME}} | {{ADDRESS_SINGLE_LINE}}</p>
    </footer>
</body>
</html>
