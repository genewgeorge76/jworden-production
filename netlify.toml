# NOTE: The forced "/work/*" and "/videos/*" → media CDN rewrites were removed.
# The CDN (media.jwordenasphaltpaving.com) is empty and 404s for every asset, and
# a forced rewrite shadows the real static files now shipping in the deploy.
# Completed-job photos (/work/*) and videos (/videos/*) are served directly from
# the build output instead.

