[build]
  base    = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION        = "20"
  VITE_SITE_URL       = "https://www.jwordenasphaltpaving.com"
  PREMIUM_GATE_STRICT = "1"
  PUPPETEER_CACHE_DIR = "/opt/buildhome/.cache/puppeteer"
  # Authority engine reads this to call /api/v1/authority/local-proof at build time.
  # Failures degrade to cached content — never block the build.
  VITE_API_BASE_URL   = "https://jworden-api.fly.dev"
  VITE_DEPLOY_MODE    = "production"
  # Media CDN pruning is DISABLED: media.jwordenasphaltpaving.com returns 404
  # for all /work and /videos assets (it was never populated). Pruning local
  # media while the CDN is empty made every completed-job photo 404 → SPA
  # fallback HTML → broken images. Ship the images with the deploy instead.
  MEDIA_CDN_PRUNE_ENABLED = "false"
  MEDIA_CDN_PRUNE_PATHS = "work/,videos/parking-lot.mp4"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

