name: Verify Secrets (read-only)

# Throwaway check: confirms the deploy token authenticates to Fly.io and
# that the master key is present. Does NOT deploy or change anything.
on:
  push:
    branches: [claude/system-2-audit-gaps-5xlhvf]
    paths: ['.github/workflows/verify-secrets.yml']
  workflow_dispatch:

jobs:
  verify:
    name: Verify secrets
    runs-on: ubuntu-latest
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check FLY_API_TOKEN authenticates (read-only whoami)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is NOT set in GitHub Secrets."
            exit 1
          fi
          echo "FLY_API_TOKEN is present. Asking Fly.io who this token belongs to..."
          flyctl auth whoami

      - name: Confirm the token can see the jworden-api app (read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Apps this token can see:"
          flyctl apps list || echo "::warning::Could not list apps — token may be app-scoped (that's OK if it can deploy jworden-api)."

      - name: Confirm JWORDEN_MASTER_KEY is present (value never printed)
        env:
          JWORDEN_MASTER_KEY: ${{ secrets.JWORDEN_MASTER_KEY }}
        run: |
          if [ -n "$JWORDEN_MASTER_KEY" ]; then
            echo "JWORDEN_MASTER_KEY is set (length: ${#JWORDEN_MASTER_KEY} characters). Value not shown."
          else
            echo "::warning::JWORDEN_MASTER_KEY is NOT set. We'll need it later for tenant registration, but it isn't required for this check."
          fi
