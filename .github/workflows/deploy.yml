name: Deploy

# Runs automatically on every push to main.
# Can also be triggered manually from the Actions tab with optional environment override.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (production | preview)"
        required: false
        default: "production"

permissions:
  contents: read
  security-events: read

# Only one deployment per branch runs at a time; newer run cancels the previous one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Front-end: build & verify ────────────────────────────────────────────────
  # This job does not deploy. Vercel's Git integration owns deployment and builds
  # straight from the repo on push; this job exists to fail the run if the build
  # breaks, and to keep the dist/ artifact available for inspection.
  build-frontend:
    name: Build Front-End
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── Set up environment variables ───────────────────────────────────────
      - name: Bootstrap .env from .env.example
        run: cp .env.example .env

      # ── Install dependencies ───────────────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci

      # NOTE: guard:tenant-contract-drift, guard:operating-system-contract,
      # and guard:deploy-mode used to run here (plus the Python setup they
      # needed for nothing else in this job). All three read
      # src/config/siteFactoryManifest.json and/or a deploy-platform config
      # file that has never existed in this repo (this app deploys via
      # vercel.json). Removed as a gate; see the matching NOTE in ci.yml.

      - name: Guard release readiness
        run: npm run guard:release-readiness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Check required build variables
        run: |
          [ -n "$VITE_API_BASE_URL" ] || (echo "::error::Missing VITE_API_BASE_URL" && exit 1)
          [ -n "$VITE_SITE_URL" ] || (echo "::error::Missing VITE_SITE_URL" && exit 1)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://codexbuildfreeofbase44-production.up.railway.app' }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL || 'https://www.jwordenasphaltpaving.com' }}

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build front-end
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://codexbuildfreeofbase44-production.up.railway.app' }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL || 'https://www.jwordenasphaltpaving.com' }}
          VITE_GA4_ID: ${{ secrets.VITE_GA4_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_PLACE_ID: ${{ secrets.VITE_GOOGLE_PLACE_ID }}

      # ── Validate build output ──────────────────────────────────────────────
      - name: Validate dist/
        run: |
          [ -d dist ] || (echo "dist/ not found" && exit 1)
          [ -f dist/index.html ] || (echo "dist/index.html missing" && exit 1)
          echo "dist/ looks good:"
          ls -lh dist/

      # ── Upload build artifact ──────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ── Back-end: validate, test, build Docker ────────────────────────────────────
  # NOTE: deploy-backend used to live here, building/smoke-testing app/ — a
  # Python backend in this frontend repo that isn't what's actually deployed
  # (the real, live API is jworden-api.fly.dev, built from the separate
  # codexbuildfreeofbase44 repo). app/ is missing ~20 modules it imports
  # (app/services/runtime_config.py, autonomy_state.py, staff_auth.py,
  # geocoding.py, and more), so `from app.main import app` has never once
  # succeeded since this code was added — this job, and everything gated on
  # it, has failed on every run since. Removed as a gate; app/ itself is
  # left untouched for whoever picks that work back up.

  # ── Integration: E2E smoke tests against the deployed frontend ───────────────
  integration-tests:
    name: Integration & E2E Tests
    needs: [build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests
        run: npm run test:unit --if-present

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests (frontend ↔ mock backend)
        run: npm run test:e2e --if-present
        env:
          VITE_API_BASE_URL: http://127.0.0.1:9999
          VITE_CC_PASSWORD: e2e-pin
