# GitLab CI for jworden-production.
#
# GitHub Actions is dead on this account (every job dies at steps=0 with 404
# logs — an account-level restriction, not a code problem), so CI moved here.
# GitLab free gives 400 compute minutes a month; these jobs use a few per push.
#
# Two things happen automatically:
#   test    — on every push and merge request, so a broken build is caught
#   deploy  — on main only, ships the API to Fly
#
# The deploy needs FLY_API_TOKEN as a masked, protected CI/CD variable:
#   Settings -> CI/CD -> Variables -> Add
#     key:  FLY_API_TOKEN
#     value: output of `fly tokens create deploy -a jworden-api`
#     masked: yes   protected: yes
# Without it the deploy job fails loudly rather than silently doing nothing.

stages: [test, deploy]

# ── Tests ────────────────────────────────────────────────────────────────────

test:api:
  stage: test
  image: python:3.12-slim
  # This list must remain a SUPERSET of deploy:api's. If deploy can be triggered
  # by a path that test ignores, that path ships with nothing verifying it boots
  # — which is how a fly.toml-only change reached production unchecked.
  # tests/ and .gitlab-ci.yml are here and not in deploy's list on purpose:
  # changing a test or this file must run the suite, and need not deploy.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [app/**/*, alembic/**/*, scripts/**/*, tests/**/*, requirements*.txt, Dockerfile, fly.toml, .gitlab-ci.yml]
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [app/**/*, alembic/**/*, scripts/**/*, tests/**/*, requirements*.txt, Dockerfile, fly.toml, .gitlab-ci.yml]
  before_script:
    - pip install --quiet --disable-pip-version-check -r requirements.backend.txt
  script:
    # the app must import cleanly — catches the missing-module class of failure
    # that only shows up at boot, after a deploy has already replaced the old one
    - python3 -c "import app.main; print('app imports OK')"
    # ── The test suite ───────────────────────────────────────────────────────
    # This job was named test:api and ran no tests. It checked that the app
    # imports, that Alembic has one head, and that fly.toml has no shell syntax
    # — all worth doing, none of them a test of behaviour. Every test in this
    # repository gated nothing: a merge request could reintroduce any bug the
    # suite covers and CI would go green.
    #
    # pytest was already installed here (requirements.backend.txt line 66) and
    # never invoked. The suite needs no services — conftest points DATABASE_URL
    # at a sqlite file in tmp_path and unsets REDIS_URL and CELERY_BROKER_URL.
    # -m "not network": a few tests hit real public APIs (USDA Soil Data
    # Access) to prove an integration reads live data rather than a fixture.
    # Valuable to run by hand; a third party being down must not redden this
    # pipeline. Run them locally with: pytest -m network
    - python3 -m pytest -q -m "not network"
    # tests/ outside pytest.ini's testpaths. test_worker_topology.py imports
    # celery, which is installed here but not in every dev sandbox, which is
    # why it is run explicitly rather than folded into testpaths.
    - python3 -m pytest tests/test_worker_topology.py -q
    # ── Tenant isolation ratchet ─────────────────────────────────────────────
    # audit_tenant_isolation.py has supported --max since it was written, and
    # its own docstring describes using it in CI as a ratchet. It was never
    # wired in.
    #
    # The alarming figure this comment used to carry -- "16 of 123 filtered",
    # later "20 of 187" -- was an artifact of the audit itself. It searched the
    # query chain for the literal string "tenant_id", and the canonical filter
    # here is scope(query, Model, tenant_of(auth)), which contains no such
    # string. 75 correctly scoped queries were counted as violations, and any
    # query fixed the right way left the count unchanged, so this number could
    # never have come down. Corrected: 95 of 185 filtered, 90 genuinely
    # unfiltered.
    #
    # This does not fix those 90. It stops the number growing while they are
    # worked down. LOWER THIS as sites are fixed; never raise it to make a
    # pipeline pass.
    #
    # It also does not see by-id lookups at all -- db.get(Model, pk) is not a
    # db.query() call. 41 of those sit behind tenant auth and are the more
    # dangerous shape. Use tenancy.get_scoped(); this check will not catch a
    # missed one.
    - python3 scripts/audit_tenant_isolation.py --max 55
    # exactly one alembic head: a fork in the migration chain breaks every
    # future deploy, and it is invisible until someone runs upgrade.
    #
    # This asks Alembic rather than parsing the files. The previous version
    # regex-matched down_revision against a quoted string:
    #     ^down_revision(?::\s*[^=]+)?\s*=\s*['\"]([^'\"]+)
    # A merge revision's down_revision is a TUPLE — ('abc', 'def') — which
    # starts with '(' and never matched, so neither parent was recorded and
    # all three revisions looked like heads. The check that exists to catch a
    # forked chain could not recognise the one construct that converges one,
    # and reported 3 heads for a tree Alembic resolves to 1. ScriptDirectory
    # is the same resolver `alembic upgrade head` uses, so it agrees with the
    # deploy by construction and understands merges and depends_on for free.
    - |
      python3 - <<'PY'
      from alembic.config import Config
      from alembic.script import ScriptDirectory
      heads = sorted(ScriptDirectory.from_config(Config('alembic.ini')).get_heads())
      print('migration heads:', heads)
      assert len(heads) == 1, f'expected exactly 1 alembic head, found {len(heads)}: {heads}'
      PY
    # No shell syntax in [processes]. Fly exec's these commands directly — there
    # is no shell — so "0.0.0.0:${PORT:-8000}" reaches gunicorn verbatim and it
    # exits with "Error: '${PORT' is not a valid port number." Every app machine
    # then crash-loops to the max restart count and Fly suspends the app.
    # `flyctl config validate` does NOT catch this: the value is a legal TOML
    # string, so only a check like this one finds it before it ships.
    - |
      python3 - <<'PY'
      import re, sys, tomllib
      cfg = tomllib.load(open('fly.toml','rb'))
      bad = {n: c for n, c in cfg.get('processes', {}).items()
             if re.search(r'\$\{|\$[A-Za-z_]|`|\|\||&&', c)}
      if bad:
          for n, c in bad.items():
              print(f'fly.toml [processes].{n} contains shell syntax: {c}', file=sys.stderr)
          sys.exit('process commands are exec\'d directly; nothing expands these')
      print('fly.toml [processes] OK:', ', '.join(cfg.get('processes', {})))
      PY
  timeout: 15m

# ── Deploy ───────────────────────────────────────────────────────────────────

deploy:api:
  stage: deploy
  image: debian:stable-slim
  rules:
    # only main, and only when something the API actually ships has changed
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [app/**/*, alembic/**/*, scripts/**/*, requirements*.txt, Dockerfile, fly.toml]
  environment:
    name: production
    url: https://jworden-api.fly.dev
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates python3 >/dev/null
    - curl -sL https://fly.io/install.sh | sh
    - export PATH="/root/.fly/bin:$PATH"
    - |
      # The Fly token contains a space and commas, so GitLab refuses to MASK it
      # verbatim — an unmasked variable can be echoed into a job log by any
      # careless command. It is stored base64-encoded instead (pure base64
      # alphabet passes the masking rules) and decoded here at use time.
      if [ -n "${FLY_API_TOKEN_B64:-}" ]; then
        FLY_API_TOKEN="$(printf '%s' "$FLY_API_TOKEN_B64" | base64 -d)"
        export FLY_API_TOKEN
      fi
      if [ -z "${FLY_API_TOKEN:-}" ]; then
        echo "No Fly credential. Set FLY_API_TOKEN_B64 (masked+protected) under"
        echo "Settings -> CI/CD -> Variables. Generate with:"
        echo "  fly tokens create deploy -a jworden-api | base64 -w0"
        exit 1
      fi
  script:
    - export PATH="/root/.fly/bin:$PATH"
    # ── Pre-deploy triage ────────────────────────────────────────────────
    # Added during the 2026-08-21 outage. Machine 286d724c97e768 (app group)
    # stopped passing /health and stopped answering the Machines API — two
    # consecutive deploys, including a straight revert of the last change,
    # failed with "failed to get VM ... request canceled" while both worker
    # and both beat machines updated cleanly. A machine the control plane
    # cannot query cannot be rolled, so the deploy dies on it every time and
    # the app group stays on whatever image it had.
    #
    # So, before deploying: show the machine table and recent logs (the crash
    # reason must end up in CI output, not trapped inside Fly), then restart
    # each app-group machine that is not in a healthy started state. If a
    # restart fails — the control-plane-unreachable case — destroy that
    # machine and re-establish the group at two machines. Destroying sounds
    # drastic; it is the documented remedy for a wedged Fly machine, the app
    # is stateless (state lives in Postgres and Redis), and the alternative
    # is a deploy that can never complete.
    - |
      echo "── machine table ──"
      flyctl machine list -a jworden-api || true
      echo "── recent logs (crash reasons live here) ──"
      flyctl logs -a jworden-api --no-tail 2>&1 | tail -150 || true
    - |
      set +e
      flyctl machine list -a jworden-api --json > /tmp/machines.json
      APP_IDS=$(python3 - <<'PYEOF'
      import json
      try:
          machines = json.load(open('/tmp/machines.json'))
      except Exception:
          machines = []
      for m in machines:
          group = (m.get('config', {}).get('metadata', {}) or {}).get('fly_process_group')                   or m.get('process_group') or ''
          if group == 'app':
              print(m.get('id', ''))
      PYEOF
      )
      echo "app-group machines: ${APP_IDS:-none found}"
      for mid in $APP_IDS; do
        echo "── restarting $mid ──"
        if ! flyctl machine restart "$mid" -a jworden-api; then
          echo "restart failed — destroying wedged machine $mid"
          flyctl machine destroy "$mid" -a jworden-api --force || true
        fi
      done
      set -e
    # --remote-only builds on Fly's builders, so CI needs no docker daemon.
    # The release_command in fly.toml runs `python -m app.db_release` first; if
    # the schema step fails the deploy aborts and the old version keeps serving.
    # (It lives in app/, not scripts/, because .dockerignore excludes both
    #  `*.sh` and `scripts/` — a release script there is absent from the image.)
    # --wait-timeout raised from the 5-minute default: a machine coming back
    # from a restart can take longer to settle, and timing out mid-roll is what
    # left the group half-updated during the outage.
    - flyctl deploy --remote-only -a jworden-api --wait-timeout 600
    # If any app machine was destroyed above, deploy only updates survivors —
    # re-establish the group at two machines so one bad host cannot take the
    # API to zero again.
    - flyctl scale count app=2 -a jworden-api -y || true
  after_script:
    # prove the thing that just shipped is actually answering
    - |
      sleep 15
      code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://jworden-api.fly.dev/health || echo 000)
      echo "post-deploy /health -> $code"
      [ "$code" = "200" ] || echo "WARNING: health check did not return 200"
  timeout: 30m
